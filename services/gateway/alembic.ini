# Alembic (database migrations). Run from this directory: `alembic upgrade head`.
# The database URL comes from the environment (see gateway/config.py), not this file.
[alembic]
script_location = gateway/migrations
# Make `import gateway` work when run as the `alembic` command from /app.
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
