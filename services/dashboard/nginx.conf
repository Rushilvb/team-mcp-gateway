# Serves the built React app. Runs as non-root (nginx-unprivileged image) on 8080.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Security headers (also on errors: `always`).
    # CSP: only our own scripts and API, nothing from other sites. Scripts stay
    # strict (no inline JS: the main XSS defense). Inline STYLES are allowed
    # ('unsafe-inline' in style-src) so style="..." attributes and <style> blocks
    # from React or libraries never break the page; injected CSS can't run code.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite puts a content hash in asset file names, so they can be cached forever.
    # (`expires`, not add_header: an add_header here would drop the headers above.)
    location /assets/ {
        expires 1y;
    }

    # Single-page app: any other path (/servers, /invite/abc, ...) gets index.html
    # and React Router picks the page. index.html itself is never cached.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
