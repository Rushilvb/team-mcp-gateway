# Production: k3s on a VPS. Same chart as local; only these values differ.
# The hostname is filled in by `make deploy-prod DOMAIN=...` (--set ingress.host=shop.<domain>),
# so no real domain lives in git. No secrets here: they're generated by Helm and kept across upgrades.

storageClass: local-path          # k3s ships the local-path provisioner on the VPS too

ingress:
  host: shop.example.com          # placeholder, overridden by make deploy-prod
  annotations:
    # cert-manager watches Ingresses with this annotation and obtains a Let's
    # Encrypt certificate into the Secret named below (see `make cert-manager`).
    cert-manager.io/cluster-issuer: letsencrypt
  tls:
    enabled: true                 # site URL becomes https://; Traefik terminates TLS
    secretName: shop-tls

mariadb:
  storage: 5Gi
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits:   { cpu: "1",  memory: 1Gi }

wordpress:
  storage: 5Gi
  admin:
    email: admin@example.com      # placeholder; set your own with --set wordpress.admin.email=...
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: "1",  memory: 1Gi }
