{{- /*
Store bootstrap: installs WordPress + WooCommerce and configures the shop.
It is a Helm hook, so it runs after every install/upgrade (with --wait: after
MariaDB and WordPress are Ready). The script (files/bootstrap.sh) is idempotent.
The pod spec is shared with the reset-demo Job: see _wpcli-pod.tpl.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-bootstrap
  labels: {{- include "store.labels" . | nindent 4 }}
    app.kubernetes.io/name: bootstrap
  annotations:
    helm.sh/hook: post-install,post-upgrade
    # Delete the previous run only when a new one starts, so logs stay readable.
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ .Values.bootstrap.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.bootstrap.activeDeadlineSeconds }}
  template: {{- include "store.wpcliPod" (dict "ctx" $ "script" "bootstrap.sh" "component" "bootstrap") | nindent 4 }}
