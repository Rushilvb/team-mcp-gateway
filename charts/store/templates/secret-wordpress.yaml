{{- $name := printf "%s-wp-admin" .Release.Name }}
{{- $salts := printf "%s-wp-salts" .Release.Name }}
{{- /*
WordPress auth keys/salts sign login cookies and nonces. The image would
otherwise generate random ones on every pod start (wp-config.php is not on a
volume), logging everyone out on each restart. Keys are named exactly like the
env vars wp-config-docker.php reads, so pods can use envFrom.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "store.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  username: {{ .Values.wordpress.admin.user | quote }}
  password: {{ include "store.secretValue" (dict "ctx" $ "secret" $name "key" "password" "override" .Values.wordpress.admin.password "generate" (randAlphaNum 24)) | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $salts }}
  labels: {{- include "store.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
{{- range $k := list "WORDPRESS_AUTH_KEY" "WORDPRESS_SECURE_AUTH_KEY" "WORDPRESS_LOGGED_IN_KEY" "WORDPRESS_NONCE_KEY" "WORDPRESS_AUTH_SALT" "WORDPRESS_SECURE_AUTH_SALT" "WORDPRESS_LOGGED_IN_SALT" "WORDPRESS_NONCE_SALT" }}
  {{ $k }}: {{ include "store.secretValue" (dict "ctx" $ "secret" $salts "key" $k "override" "" "generate" (randAlphaNum 64)) | quote }}
{{- end }}
