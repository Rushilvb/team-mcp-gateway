apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db
  labels: {{- include "store.labels" . | nindent 4 }}
  annotations:
    # The DB volume outlives `helm uninstall`, so its password must too.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  root-password: {{ include "store.secretValue" (dict "ctx" $ "secret" (printf "%s-db" .Release.Name) "key" "root-password" "override" .Values.mariadb.rootPassword "generate" (randAlphaNum 32)) | quote }}
  password: {{ include "store.secretValue" (dict "ctx" $ "secret" (printf "%s-db" .Release.Name) "key" "password" "override" .Values.mariadb.password "generate" (randAlphaNum 32)) | quote }}
