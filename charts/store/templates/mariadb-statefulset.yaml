# StatefulSet (not Deployment) because the database has identity + its own disk:
# pod "store-mariadb-0" always gets PVC "data-store-mariadb-0" back after a restart.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-mariadb
  labels: {{- include "store.labels" . | nindent 4 }}
    app.kubernetes.io/name: mariadb
spec:
  serviceName: {{ .Release.Name }}-mariadb
  replicas: 1
  selector:
    matchLabels: {{- include "store.selectorLabels" (dict "ctx" $ "name" "mariadb") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "store.labels" . | nindent 8 }}
        app.kubernetes.io/name: mariadb
      # No "checksum/secret" annotation on purpose: our Secrets never change after
      # first install (kept via lookup), and on first install the template renders
      # fresh random values, so the hash would change on the first `helm upgrade`
      # and restart the database for nothing. MariaDB only reads the passwords
      # when it initialises an empty data dir anyway.
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999          # "mysql" user inside the official image
        runAsGroup: 999
        fsGroup: 999            # volume files group-owned by mysql
      containers:
        - name: mariadb
          image: "{{ .Values.images.mariadb.repository }}:{{ .Values.images.mariadb.tag }}"
          imagePullPolicy: {{ .Values.images.mariadb.pullPolicy }}
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Release.Name }}-db, key: root-password } }
            - name: MARIADB_DATABASE
              value: {{ .Values.mariadb.database | quote }}
            - name: MARIADB_USER
              value: {{ .Values.mariadb.user | quote }}
            - name: MARIADB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Release.Name }}-db, key: password } }
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          # healthcheck.sh ships with the image and uses a dedicated healthcheck
          # user created on first init, so no password appears in the probe.
          startupProbe:          # first init can take a while; liveness waits for this
            exec: { command: ["healthcheck.sh", "--connect", "--innodb_initialized"] }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:        # ready = accepting connections + InnoDB up
            exec: { command: ["healthcheck.sh", "--connect", "--innodb_initialized"] }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:         # alive = process answers at all
            exec: { command: ["healthcheck.sh", "--connect"] }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources: {{- toYaml .Values.mariadb.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- include "store.storageClass" . | nindent 8 }}
        resources:
          requests:
            storage: {{ .Values.mariadb.storage }}
