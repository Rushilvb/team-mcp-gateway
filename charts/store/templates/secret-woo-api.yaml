{{- $name := printf "%s-woo-api" .Release.Name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "store.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  # Plain values live only here. WooCommerce's DB stores HMAC-SHA256(key, "wc-api").
  consumer-key: {{ include "store.secretValue" (dict "ctx" $ "secret" $name "key" "consumer-key" "override" .Values.woocommerce.apiKey.consumerKey "generate" (printf "ck_%s" (include "store.randHex40" .))) | quote }}
  consumer-secret: {{ include "store.secretValue" (dict "ctx" $ "secret" $name "key" "consumer-secret" "override" .Values.woocommerce.apiKey.consumerSecret "generate" (printf "cs_%s" (include "store.randHex40" .))) | quote }}
