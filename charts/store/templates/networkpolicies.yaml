# Store firewall (enforced by k3s's NetworkPolicy controller).
#
# Backstop: deny all ingress to every pod in this namespace unless a policy
# below allows it, so a future pod is closed by default.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  labels: {{- include "store.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# WordPress: public traffic via Traefik, plus our woo-mcp server (REST API).
# Out: its database, DNS, and the internet on 80/443 (WordPress/WooCommerce
# update checks), excluding private and link-local ranges.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wordpress
  labels: {{- include "store.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "store.selectorLabels" (dict "ctx" $ "name" "wordpress") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { app.kubernetes.io/name: traefik } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .Values.wooMcpNamespace }} } }
          podSelector: { matchLabels: { app.kubernetes.io/name: woo-mcp } }
      ports:
        - { protocol: TCP, port: 80 }
  egress:
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: mariadb } }
      ports:
        - { protocol: TCP, port: 3306 }
    {{- include "store.egressDnsAndInternet" . | nindent 4 }}
---
# MariaDB: only WordPress and the bootstrap Job may connect. It never needs to
# open a connection itself, so all egress is denied.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mariadb
  labels: {{- include "store.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "store.selectorLabels" (dict "ctx" $ "name" "mariadb") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: wordpress } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: bootstrap } }
      ports:
        - { protocol: TCP, port: 3306 }
  egress: []
---
# Bootstrap Job: nothing connects to it. Out: the database, DNS, and the internet
# (it downloads WooCommerce from downloads.wordpress.org).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bootstrap
  labels: {{- include "store.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: bootstrap
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: mariadb } }
      ports:
        - { protocol: TCP, port: 3306 }
    {{- include "store.egressDnsAndInternet" . | nindent 4 }}
