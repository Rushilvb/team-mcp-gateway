# Production: k3s on a VPS. Same chart as local; only these values differ.
# Filled in by `make deploy-prod DOMAIN=... REGISTRY=...`:
#   gateway.publicHost=app.<domain>, wooMcp.store.publicHost=shop.<domain>,
#   <svc>.image.repository=<REGISTRY>/<svc>, <svc>.image.tag=<content hash>
# so no real domain or registry owner lives in git. No secrets here: they're
# generated by Helm (kept via lookup) or created with `make llm-secret`.

storageClass: local-path

# If the GHCR packages are private: create a pull secret and list it here, e.g.
#   kubectl -n platform create secret docker-registry ghcr-pull --docker-server=ghcr.io \
#     --docker-username=<user> --docker-password=<token with read:packages>
# imagePullSecrets: [{ name: ghcr-pull }]
imagePullSecrets: []

gateway:
  publicHost: app.example.com                 # placeholder, overridden by make deploy-prod
  ingress:
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
    tls:
      enabled: true                           # PUBLIC_URL becomes https://app.<domain>
      secretName: app-tls
  cookieSecure: true                          # session cookie only ever sent over HTTPS
  adminEmail: admin@example.com               # placeholder; set your own with --set gateway.adminEmail=...
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: "1",  memory: 768Mi }

wooMcp:
  store:
    # Must equal the store's public host (WordPress signs/serves under it).
    # woo-mcp still talks plain HTTP inside the cluster, so it signs http://<host>/...:
    # correct, because WordPress sees no TLS on that in-cluster hop.
    publicHost: shop.example.com              # placeholder, overridden by make deploy-prod

postgres:
  storage: 5Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: "1",  memory: 1Gi }
