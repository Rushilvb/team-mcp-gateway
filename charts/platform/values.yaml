# Defaults for the platform chart. Environment-specific overrides live in
# values-local.yaml and values-prod.yaml.

wooMcp:
  image:
    repository: urumi/woo-mcp
    tag: ""                       # set by the Makefile (hash of the source), required
    pullPolicy: IfNotPresent
  replicas: 1
  store:
    namespace: store              # where the store chart is installed
    # In-cluster address of the WordPress Service (plain HTTP, never leaves the cluster).
    url: http://store-wordpress.store.svc.cluster.local
    # Public host of the store = WordPress's site URL host. Sent as the Host
    # header and used in the OAuth signature.
    publicHost: shop.localtest.me
    timezone: Asia/Kolkata
    timeoutSeconds: 10
    # The store chart's API key Secret, copied into this namespace by Helm.
    apiKeySecret: store-woo-api
    # Set both to skip the copy (e.g. a store managed elsewhere). Leave empty normally.
    consumerKey: ""
    consumerSecret: ""
  resources:
    requests: { cpu: 50m,  memory: 96Mi }
    limits:   { cpu: 500m, memory: 256Mi }

# "" = use the cluster's default StorageClass.
storageClass: ""

postgres:
  image:
    repository: postgres
    tag: "18.4"
    pullPolicy: IfNotPresent
  storage: 2Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: "1",  memory: 512Mi }

notesMcp:
  image:
    repository: urumi/notes-mcp
    tag: ""                       # set by the Makefile, required
    pullPolicy: IfNotPresent
  replicas: 1
  token: ""                       # bearer token clients must send; empty = generate
  resources:
    requests: { cpu: 50m,  memory: 96Mi }
    limits:   { cpu: 500m, memory: 256Mi }

fxMcp:
  image:
    repository: urumi/fx-mcp
    tag: ""                       # set by the Makefile, required
    pullPolicy: IfNotPresent
  replicas: 1
  apiKey: ""                      # X-API-Key clients must send; empty = generate
  # Reference rates (static, not live): value of 1 unit of each currency in `base`.
  rates:
    base: INR
    as_of: "2026-10-01"
    rates:
      USD: "84.10"
      EUR: "91.50"
      GBP: "109.80"
      AED: "22.90"
      SGD: "64.70"
      JPY: "0.56"
  resources:
    requests: { cpu: 25m,  memory: 64Mi }
    limits:   { cpu: 250m, memory: 192Mi }
