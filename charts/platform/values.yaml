# Defaults for the platform chart. Environment-specific overrides live in
# values-local.yaml and values-prod.yaml.

wooMcp:
  image:
    repository: urumi/woo-mcp
    tag: ""                       # set by the Makefile (hash of the source), required
    pullPolicy: IfNotPresent
  replicas: 1
  store:
    namespace: store              # where the store chart is installed
    # In-cluster address of the WordPress Service (plain HTTP, never leaves the cluster).
    url: http://store-wordpress.store.svc.cluster.local
    # Public host of the store = WordPress's site URL host. Sent as the Host
    # header and used in the OAuth signature.
    publicHost: shop.localtest.me
    timezone: Asia/Kolkata
    timeoutSeconds: 10
    # The store chart's API key Secret, copied into this namespace by Helm.
    apiKeySecret: store-woo-api
    # Set both to skip the copy (e.g. a store managed elsewhere). Leave empty normally.
    consumerKey: ""
    consumerSecret: ""
  resources:
    requests: { cpu: 50m,  memory: 96Mi }
    limits:   { cpu: 500m, memory: 256Mi }

# "" = use the cluster's default StorageClass.
storageClass: ""

postgres:
  image:
    repository: postgres
    tag: "18.4"
    pullPolicy: IfNotPresent
  storage: 2Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: "1",  memory: 512Mi }

notesMcp:
  image:
    repository: urumi/notes-mcp
    tag: ""                       # set by the Makefile, required
    pullPolicy: IfNotPresent
  replicas: 1
  token: ""                       # bearer token clients must send; empty = generate
  resources:
    requests: { cpu: 50m,  memory: 96Mi }
    limits:   { cpu: 500m, memory: 256Mi }

fxMcp:
  image:
    repository: urumi/fx-mcp
    tag: ""                       # set by the Makefile, required
    pullPolicy: IfNotPresent
  replicas: 1
  apiKey: ""                      # X-API-Key clients must send; empty = generate
  # Reference rates (static, not live): value of 1 unit of each currency in `base`.
  rates:
    base: INR
    as_of: "2026-10-01"
    rates:
      USD: "84.10"
      EUR: "91.50"
      GBP: "109.80"
      AED: "22.90"
      SGD: "64.70"
      JPY: "0.56"
  resources:
    requests: { cpu: 25m,  memory: 64Mi }
    limits:   { cpu: 250m, memory: 192Mi }

gateway:
  image:
    repository: urumi/gateway
    tag: ""                       # set by the Makefile, required
    pullPolicy: IfNotPresent
  # Public host for the dashboard, /api and /mcp (Ingress + allowed Host header).
  publicHost: app.localtest.me
  ingress:
    className: traefik
    annotations: {}
    tls:
      enabled: false
      secretName: ""
  # Bootstrap admin, created on first start if missing. Empty password = generate.
  adminEmail: admin@example.com
  adminPassword: ""
  # Session cookie only over HTTPS. Must be true in prod (TLS), false for local http.
  cookieSecure: false
  callTimeoutSeconds: 15
  healthIntervalSeconds: 15
  healthTimeoutSeconds: 5
  # Upstreams registered on first start (in this order). `service` = a Service in
  # this namespace on port 8000; it is also added to the SSRF allowlist.
  bootstrapUpstreams:
    - slug: woo
      name: WooCommerce store
      service: woo-mcp
      authType: none
    - slug: notes
      name: Team notes
      service: notes-mcp
      authType: bearer
      credentialSecret: { name: notes-mcp-auth, key: token }
    - slug: fx
      name: Currency conversion
      service: fx-mcp
      authType: header
      headerName: X-API-Key
      credentialSecret: { name: fx-mcp-auth, key: api-key }
  # Chat agent. The API key is NOT a value: `make llm-secret` creates the
  # gateway-llm Secret with kubectl, so it never lands in git or Helm history.
  chat:
    model: gemini-3.6-flash
    maxSteps: 8
    timeoutSeconds: 90
  # Extra cluster-internal hostnames admins may register later (SSRF allowlist).
  extraSsrfAllowedHosts: []
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits:   { cpu: "1",  memory: 512Mi }

dashboard:
  image:
    repository: urumi/dashboard
    tag: ""                       # set by the Makefile, required
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests: { cpu: 10m,  memory: 16Mi }
    limits:   { cpu: 200m, memory: 64Mi }
