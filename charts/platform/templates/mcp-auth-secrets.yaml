{{- /*
Static credentials the upstream MCP servers require. The gateway (Phase 4)
holds them and injects them; clients never see them.
  notes-mcp: Authorization: Bearer <token>   (credential type "bearer")
  fx-mcp:    X-API-Key: <api-key>            (credential type "header")
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: notes-mcp-auth
  labels: {{- include "platform.labels" . | nindent 4 }}
  annotations: { helm.sh/resource-policy: keep }
type: Opaque
stringData:
  token: {{ include "platform.secretValue" (dict "ctx" $ "secret" "notes-mcp-auth" "key" "token" "override" .Values.notesMcp.token "generate" (randAlphaNum 40)) | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: fx-mcp-auth
  labels: {{- include "platform.labels" . | nindent 4 }}
  annotations: { helm.sh/resource-policy: keep }
type: Opaque
stringData:
  api-key: {{ include "platform.secretValue" (dict "ctx" $ "secret" "fx-mcp-auth" "key" "api-key" "override" .Values.fxMcp.apiKey "generate" (randAlphaNum 40)) | quote }}
