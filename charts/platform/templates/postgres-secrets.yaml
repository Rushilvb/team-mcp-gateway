{{- /*
One Secret per consumer (least privilege): postgres itself gets every password,
notes-mcp only gets the notes password, the gateway (Phase 4) only its own.
All random on first install and kept across upgrades and uninstall: the data
volume outlives the release, so its passwords must too.
*/}}
{{- $notes := include "platform.secretValue" (dict "ctx" $ "secret" "postgres-notes" "key" "password" "override" "" "generate" (randAlphaNum 32)) }}
{{- $gateway := include "platform.secretValue" (dict "ctx" $ "secret" "postgres-gateway" "key" "password" "override" "" "generate" (randAlphaNum 32)) }}
apiVersion: v1
kind: Secret
metadata:
  name: postgres-superuser
  labels: {{- include "platform.labels" . | nindent 4 }}
  annotations: { helm.sh/resource-policy: keep }
type: Opaque
stringData:
  password: {{ include "platform.secretValue" (dict "ctx" $ "secret" "postgres-superuser" "key" "password" "override" "" "generate" (randAlphaNum 32)) | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-notes
  labels: {{- include "platform.labels" . | nindent 4 }}
  annotations: { helm.sh/resource-policy: keep }
type: Opaque
stringData:
  password: {{ $notes | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-gateway
  labels: {{- include "platform.labels" . | nindent 4 }}
  annotations: { helm.sh/resource-policy: keep }
type: Opaque
stringData:
  password: {{ $gateway | quote }}
