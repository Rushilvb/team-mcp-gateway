# ClusterIP only, no Ingress: called only by the gateway.
apiVersion: v1
kind: Service
metadata:
  name: notes-mcp
  labels: {{- include "platform.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "platform.selectorLabels" (dict "ctx" $ "name" "notes-mcp") | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
