{{- /*
The WooCommerce REST API key lives in the store chart's Secret (namespace
"store"). Pods can only mount Secrets from their own namespace, so Helm copies
it here at deploy time with `lookup`. Order of preference:
  1. explicit values (wooMcp.store.consumerKey/consumerSecret)
  2. the live store Secret
  3. fail with a clear message (store not deployed yet)
Trade-offs: whoever runs `helm` needs read access to Secrets in "store", and if
the store key is ever rotated, re-run the platform deploy to copy it again.
Note: `lookup` returns nothing during `helm template`/`lint` (no cluster), so
lint with --set wooMcp.store.consumerKey=x --set wooMcp.store.consumerSecret=x.
*/}}
{{- $cfg := .Values.wooMcp.store }}
{{- $key := $cfg.consumerKey }}
{{- $secret := $cfg.consumerSecret }}
{{- if not (and $key $secret) }}
{{- $src := lookup "v1" "Secret" $cfg.namespace $cfg.apiKeySecret }}
{{- if not $src }}
{{- fail (printf "Secret %s/%s not found: deploy the store chart first (or set wooMcp.store.consumerKey and consumerSecret)" $cfg.namespace $cfg.apiKeySecret) }}
{{- end }}
{{- $key = index $src.data "consumer-key" | b64dec }}
{{- $secret = index $src.data "consumer-secret" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: woo-mcp-store-api
  labels: {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/name: woo-mcp
type: Opaque
stringData:
  consumer-key: {{ $key | quote }}
  consumer-secret: {{ $secret | quote }}
