apiVersion: v1
kind: Service
metadata:
  name: dashboard
  labels: {{- include "platform.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "platform.selectorLabels" (dict "ctx" $ "name" "dashboard") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
