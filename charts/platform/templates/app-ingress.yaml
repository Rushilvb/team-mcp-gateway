{{- $g := .Values.gateway }}
# Public entry point app.<domain>. Traefik picks the longest matching prefix:
#   /mcp, /api -> gateway        / (everything else) -> dashboard
# One host for the UI and the API = same origin: the session cookie just works
# and no CORS is needed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app
  labels: {{- include "platform.labels" . | nindent 4 }}
  {{- with $g.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ $g.ingress.className }}
  {{- if $g.ingress.tls.enabled }}
  tls:
    - hosts: [{{ $g.publicHost | quote }}]
      secretName: {{ required "gateway.ingress.tls.secretName is required when TLS is enabled" $g.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ $g.publicHost | quote }}
      http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend: { service: { name: gateway, port: { name: http } } }
          - path: /api
            pathType: Prefix
            backend: { service: { name: gateway, port: { name: http } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: dashboard, port: { name: http } } }
