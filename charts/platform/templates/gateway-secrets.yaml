{{- /*
gateway-fernet: key that encrypts upstream credentials in the gateway DB.
  Fernet wants 32 random bytes, URL-safe base64. Helm's randBytes already
  returns standard base64, so we only swap +/ for -_.
  Losing this key makes stored upstream credentials unreadable, hence `keep`.
gateway-admin: the bootstrap admin login (email from values, password generated).
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: gateway-fernet
  labels: {{- include "platform.labels" . | nindent 4 }}
  annotations: { helm.sh/resource-policy: keep }
type: Opaque
stringData:
  key: {{ include "platform.secretValue" (dict "ctx" $ "secret" "gateway-fernet" "key" "key" "override" "" "generate" (randBytes 32 | replace "+" "-" | replace "/" "_")) | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: gateway-admin
  labels: {{- include "platform.labels" . | nindent 4 }}
  annotations: { helm.sh/resource-policy: keep }
type: Opaque
stringData:
  email: {{ .Values.gateway.adminEmail | quote }}
  password: {{ include "platform.secretValue" (dict "ctx" $ "secret" "gateway-admin" "key" "password" "override" .Values.gateway.adminPassword "generate" (randAlphaNum 20)) | quote }}
