# Called only by the gateway. fx-mcp needs no network at all (rates come from
# a mounted file), so ALL egress is denied, DNS included.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fx-mcp
  labels: {{- include "platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "platform.selectorLabels" (dict "ctx" $ "name" "fx-mcp") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: gateway } }
      ports:
        - { protocol: TCP, port: 8000 }
  egress: []
